name: Windows release

# The editor is .NET Framework 4.8 and x86 only, so it is built with MSBuild on a
# Windows runner. The NuGet packages are not in the repository and are restored.

on:
  push:
    branches: [master, dev]
    # A tag makes a release as well as a build. See "Making a release" below.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Making a release
#
#     git tag v0.18.2 && git push origin v0.18.2
#
# The build then packs itself up and lands on the Releases page as a
# pre-release: anyone can download it, but it does not take the "Latest" badge
# from whatever holds it. GitHub gives that badge to the newest release that is
# neither a draft nor a pre-release, so a version still being worked on stays
# out of the way of the one people are meant to be using.
#
# When the version really is the public one:
#
#     gh release edit v0.18.2 --prerelease=false --latest
#
# To keep one out of sight altogether, add --draft to the command below; a
# draft is seen only by people who can write to the repository.
#
jobs:
  build:
    runs-on: windows-latest

    permissions:
      # Only to make the release; the build itself needs nothing.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to the path
        uses: microsoft/setup-msbuild@v2

      - name: Add NuGet to the path
        uses: NuGet/setup-nuget@v2

      - name: Restore the packages
        run: nuget restore "EUD Editor.sln"

      - name: Build the release
        run: msbuild "EUD Editor.sln" -t:Build -p:Configuration=Release -p:Platform=x86 -v:m

      - name: Put the data beside the program
        shell: pwsh
        run: |
          # The build does not copy Data, and the editor reads it from beside the exe.
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "EUD Editor\bin\x86\Release\*" release -Recurse -Force
          Copy-Item "EUD Editor\Data" "release\Data" -Recurse -Force
          if (-not (Test-Path "release\EUD Editor SE.exe")) { throw "the program was not built" }
          if (-not (Test-Path "release\Data\Language\English\Main.json")) { throw "the data is not there" }

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: EUD-Editor-SE-x86
          path: release

      - name: Pack the build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path release\* -DestinationPath "EUD-Editor-SE-${{ github.ref_name }}-x86.zip"

      - name: Make the pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "EUD-Editor-SE-${{ github.ref_name }}-x86.zip" --prerelease --title "EUD Editor SE ${{ github.ref_name }}" --generate-notes --notes "A build from development. Unzip it and run **EUD Editor SE.exe**; the Data folder beside it is part of the program.

          This is a pre-release, so it does not take the Latest badge."
